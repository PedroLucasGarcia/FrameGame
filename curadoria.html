<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <title>FrameGame — curadoria</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface-2: #273449; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #f59e0b; --accent-ink: #1c1206;
      --win: #22c55e; --miss: #ef4444; --radius: 12px; --gutter: 16px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Poppins, system-ui, sans-serif; padding-bottom: 96px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    a { color: var(--accent); }
    header { display: flex; align-items: center; gap: 12px; padding: 12px var(--gutter); border-bottom: 1px solid var(--border); }
    header img { height: 28px; }
    header h1 { font-size: 16px; font-weight: 600; margin: 0; color: var(--muted); }
    .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 54px); }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } aside { border-right: 0 !important; border-bottom: 1px solid var(--border); max-height: 40vh; } }
    aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
    aside label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; padding: 4px 6px 10px; }
    .day { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px; margin-bottom: 4px; }
    .day:hover { background: var(--surface); }
    .day.active { background: var(--surface-2); border-color: var(--border); }
    .day img { width: 64px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--surface); flex: none; }
    .day b { display: block; font-size: 13px; font-weight: 600; line-height: 1.3; }
    .day small { color: var(--muted); font-size: 12px; }
    .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-left: 4px; }
    .tag.cur { background: color-mix(in srgb, var(--win) 25%, transparent); color: #86efac; }
    .tag.edit { background: color-mix(in srgb, var(--accent) 25%, transparent); color: #fcd34d; }
    main { padding: var(--gutter); min-width: 0; }
    main h2 { margin: 0 0 4px; font-size: 22px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    h3 { font-size: 14px; font-weight: 600; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 760px) { .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .slot { position: relative; aspect-ratio: 16/9; border: 2px dashed var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .slot.filled { border-style: solid; border-color: var(--accent); }
    .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slot .n { position: absolute; top: 4px; left: 4px; }
    .slot .ctl { position: absolute; bottom: 4px; right: 4px; display: flex; gap: 4px; }
    .mini { width: 26px; height: 26px; border-radius: 6px; border: 0; background: rgba(15, 23, 42, .85); font-size: 13px; line-height: 1; }
    .mini:hover { background: var(--accent); color: var(--accent-ink); }
    .mini:disabled { opacity: .3; pointer-events: none; }
    .n { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
    .labels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; color: var(--muted); font-size: 11px; margin-top: 4px; }
    .labels span:last-child { text-align: right; }
    .labels span:first-child { grid-column: 1 / 4; } .labels span:last-child { grid-column: 4 / 7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .cand { position: relative; padding: 0; border: 2px solid transparent; border-radius: 10px; overflow: hidden; background: var(--surface); aspect-ratio: 16/9; }
    .cand img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cand:hover { border-color: var(--muted); }
    .cand.on { border-color: var(--accent); }
    .cand.on img { opacity: .55; }
    .cand .n { position: absolute; top: 6px; left: 6px; }
    .cand .zoom { position: absolute; top: 4px; right: 4px; }
    .cand .now { position: absolute; bottom: 4px; left: 4px; font-size: 10px; background: rgba(15, 23, 42, .85); padding: 0 6px; border-radius: 99px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .note { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; color: var(--muted); font-size: 13px; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px var(--gutter); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .bar[hidden] { display: none; }
    .bar p { margin: 0; flex: 1 1 260px; font-size: 13px; color: var(--muted); }
    .bar p b { color: var(--text); }
    .lightbox { position: fixed; inset: 0; background: rgba(2, 6, 23, .92); display: grid; place-items: center; padding: var(--gutter); z-index: 10; }
    .lightbox[hidden] { display: none; }
    .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
    .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--win); color: #052e16; font-weight: 600; padding: 8px 16px; border-radius: 99px; z-index: 20; }
    .toast[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <a href="./"><img src="img/logo.png" alt="FrameGame"></a>
    <h1>Curadoria das imagens</h1>
  </header>
  <div class="layout">
    <aside>
      <label><input type="checkbox" id="showPast"> Mostrar dias anteriores</label>
      <div id="days"></div>
    </aside>
    <main id="editor"><p class="hint">Carregando…</p></main>
  </div>

  <div class="bar" id="bar" hidden>
    <p><b id="count"></b> Baixe o arquivo e substitua <code>data/movies.json</code> no GitHub (abra o link, apague tudo, cole o conteúdo copiado e salve).</p>
    <button class="btn" id="discard">Descartar</button>
    <button class="btn" id="copy">Copiar conteúdo</button>
    <button class="btn" id="download">Baixar movies.json</button>
    <a class="btn primary" href="https://github.com/PedroLucasGarcia/FrameGame/edit/main/data/movies.json" target="_blank" rel="noopener">Editar no GitHub</a>
  </div>

  <div class="lightbox" id="lightbox" hidden><img alt=""></div>
  <div class="toast" id="toast" hidden></div>

  <script>
  (async () => {
    const IMG = 'https://image.tmdb.org/t/p/w1280';
    const THUMB = 'https://image.tmdb.org/t/p/w300';
    const STORE = 'framegame-curadoria';
    const DAY_MS = 86400000;
    const $ = (s) => document.querySelector(s);
    const thumb = (u) => u.startsWith(IMG) ? THUMB + u.slice(IMG.length) : u;
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const load = (url) => fetch(url, { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).catch(() => null);
    const [data, candidates = {}] = await Promise.all([load('data/movies.json'), load('data/candidatos.json')]);
    if (!data) { $('#editor').innerHTML = '<p class="note">Não foi possível carregar data/movies.json.</p>'; return; }

    const toUTC = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: data.timeZone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    const today = Math.floor((toUTC(todayStr) - toUTC(data.startDate)) / DAY_MS) + 1;
    const dateOf = (n) => new Date(toUTC(data.startDate) + (n - 1) * DAY_MS).toLocaleDateString('pt-BR', { timeZone: 'UTC', day: '2-digit', month: '2-digit' });

    // edições guardadas só neste navegador até o arquivo ser baixado
    let edits = {};
    try { edits = JSON.parse(localStorage.getItem(STORE)) || {}; } catch { edits = {}; }
    // descarta edições que já estão no arquivo publicado
    for (const [k, frames] of Object.entries(edits)) {
      const d = data.days.find((x) => x.day === Number(k));
      if (!d || (d.curado && JSON.stringify(d.frames) === JSON.stringify(frames))) delete edits[k];
    }
    const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(edits)); } catch { /* sem armazenamento */ } };
    persist();

    const framesOf = (d) => edits[d.day] || d.frames;
    const editable = (d) => d.frames.every((f) => f.startsWith(IMG));
    let current = (data.days.find((d) => d.day === today + 1) || data.days.find((d) => d.day >= today) || data.days[data.days.length - 1]).day;
    let selection = [];

    function renderList() {
      const showPast = $('#showPast').checked;
      $('#days').innerHTML = data.days.filter((d) => showPast || d.day >= today).map((d) => {
        const tags = [
          d.day === today ? '<span class="tag">hoje</span>' : '',
          edits[d.day] ? '<span class="tag edit">alterado</span>' : d.curado ? '<span class="tag cur">curado</span>' : '',
        ].join('');
        const f = framesOf(d);
        return `<button class="day${d.day === current ? ' active' : ''}" data-day="${d.day}">
          <img src="${esc(thumb(f[f.length - 1]))}" alt="" loading="lazy">
          <span><b>${esc(d.title)}</b><small>Dia ${d.day} · ${dateOf(d.day)}</small>${tags}</span></button>`;
      }).join('');
    }

    function renderEditor() {
      const d = data.days.find((x) => x.day === current);
      const saved = framesOf(d);
      const head = `<h2>Dia ${d.day} — ${esc(d.title)} (${d.year})</h2>`;
      if (!editable(d)) {
        $('#editor').innerHTML = `${head}<p class="note">Este dia usa imagens próprias do repositório (pasta frames/) e não é editado por aqui.</p>
          <div class="strip" style="margin-top:16px">${saved.map((f, i) => `<div class="slot filled"><img src="${esc(f)}" alt=""><span class="n">${i + 1}</span></div>`).join('')}</div>`;
        return;
      }
      const pool = [...new Set([...saved, ...d.frames, ...(candidates[d.day] || [])])];
      const grid = pool.map((u) => `<button class="cand" data-url="${esc(u)}"><img src="${esc(thumb(u))}" alt="" loading="lazy">
          ${saved.includes(u) ? '<span class="now">atual</span>' : ''}
          <span class="mini zoom" data-zoom="${esc(u)}" title="Ampliar" role="button">⤢</span></button>`).join('');
      $('#editor').innerHTML = `${head}
        <p class="hint">${d.day < today ? 'Este dia já passou: mudar agora só afeta quem jogar pelo arquivo. ' : d.day === today ? 'Este é o jogo de hoje: quem já jogou viu as imagens antigas. ' : ''}Clique nas imagens na ordem em que devem aparecer — a 1ª é a mais difícil e a 6ª, a que entrega o filme.</p>
        <h3>Ordem do jogo</h3>
        <div class="strip" id="strip"></div>
        <div class="labels"><span>← mais difícil</span><span>mais fácil →</span></div>
        <div class="row">
          <button class="btn primary" id="save">Salvar este dia</button>
          <button class="btn" id="reset">Voltar ao atual</button>
          <button class="btn" id="clear">Limpar</button>
          ${edits[d.day] ? '<button class="btn" id="undo">Desfazer alteração</button>' : ''}
        </div>
        <h3>Imagens disponíveis (${pool.length})</h3>
        ${candidates[d.day] ? '' : '<p class="note">Ainda não há imagens extras para este dia — o GitHub Actions gera a lista dos próximos dias toda noite (ou rode o workflow “Filme do dia” manualmente). Por enquanto dá para reordenar as atuais.</p><div style="height:8px"></div>'}
        <div class="grid">${grid}</div>`;
      refresh();
    }

    // atualiza só o que depende da seleção, sem recarregar as imagens da grade
    function refresh() {
      const strip = $('#strip');
      if (!strip) return;
      const saved = framesOf(data.days.find((x) => x.day === current));
      strip.innerHTML = Array.from({ length: 6 }, (_, i) => {
        const u = selection[i];
        if (!u) return `<div class="slot">${i + 1}ª imagem</div>`;
        return `<div class="slot filled"><img src="${esc(thumb(u))}" alt=""><span class="n">${i + 1}</span>
          <span class="ctl"><button class="mini" data-move="${i}" data-dir="-1" title="Mover para a esquerda" ${i === 0 ? 'disabled' : ''}>‹</button>
          <button class="mini" data-move="${i}" data-dir="1" title="Mover para a direita" ${i === selection.length - 1 ? 'disabled' : ''}>›</button>
          <button class="mini" data-remove="${i}" title="Tirar">✕</button></span></div>`;
      }).join('');
      document.querySelectorAll('.cand').forEach((c) => {
        const i = selection.indexOf(c.dataset.url);
        let n = c.querySelector(':scope > .n');
        c.classList.toggle('on', i >= 0);
        if (i < 0) { n?.remove(); return; }
        if (!n) { n = document.createElement('span'); n.className = 'n'; c.append(n); }
        n.textContent = i + 1;
      });
      const changed = JSON.stringify(selection) !== JSON.stringify(saved);
      $('#save').disabled = !(selection.length === 6 && changed);
      $('#reset').disabled = !changed;
      $('#clear').disabled = !selection.length;
    }

    function select(day) { current = day; selection = framesOf(data.days.find((x) => x.day === day)).slice(); render(); window.scrollTo(0, 0); }
    function render() { renderList(); renderEditor(); renderBar(); }

    function renderBar() {
      const n = Object.keys(edits).length;
      $('#bar').hidden = !n;
      $('#count').textContent = n === 1 ? '1 dia alterado.' : `${n} dias alterados.`;
    }

    function serialize() {
      const days = data.days.map((d) => {
        let out = d;
        if (edits[d.day]) { out = { ...d, frames: edits[d.day], ordenado: true, curado: true }; delete out.trocar; }
        return '    ' + JSON.stringify(out).replace(/,"/g, ', "').replace(/":/g, '": ').replace(/^\{/, '{ ').replace(/\}$/, ' }');
      });
      return `{\n  "startDate": ${JSON.stringify(data.startDate)},\n  "timeZone": ${JSON.stringify(data.timeZone)},\n  "days": [\n${days.join(',\n')}\n  ]\n}\n`;
    }

    function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200); }

    $('#days').addEventListener('click', (e) => { const b = e.target.closest('[data-day]'); if (b) select(Number(b.dataset.day)); });
    $('#showPast').addEventListener('change', renderList);

    $('#editor').addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('[data-zoom]')) { const lb = $('#lightbox'); lb.querySelector('img').src = t.closest('[data-zoom]').dataset.zoom; lb.hidden = false; return; }
      const c = t.closest('[data-url]');
      if (c) {
        const u = c.dataset.url, i = selection.indexOf(u);
        if (i >= 0) selection.splice(i, 1); else if (selection.length < 6) selection.push(u); else toast('Já há 6 imagens: tire uma antes.');
        return refresh();
      }
      const mv = t.closest('[data-move]');
      if (mv) { const i = Number(mv.dataset.move), j = i + Number(mv.dataset.dir); [selection[i], selection[j]] = [selection[j], selection[i]]; return refresh(); }
      const rm = t.closest('[data-remove]');
      if (rm) { selection.splice(Number(rm.dataset.remove), 1); return refresh(); }
      const d = data.days.find((x) => x.day === current);
      if (t.id === 'save') {
        if (JSON.stringify(selection) === JSON.stringify(d.frames) && d.curado) delete edits[current]; else edits[current] = selection.slice();
        persist(); render(); toast(`Dia ${current} salvo neste navegador.`);
      } else if (t.id === 'reset') { selection = framesOf(d).slice(); refresh(); }
      else if (t.id === 'clear') { selection = []; refresh(); }
      else if (t.id === 'undo') { delete edits[current]; persist(); selection = d.frames.slice(); render(); }
    });

    $('#lightbox').addEventListener('click', () => { $('#lightbox').hidden = true; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#lightbox').hidden = true; });

    $('#download').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([serialize()], { type: 'application/json' }));
      a.download = 'movies.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    $('#copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(serialize()); toast('Conteúdo copiado.'); } catch { toast('Não deu para copiar: use “Baixar”.'); }
    });
    $('#discard').addEventListener('click', () => {
      if (!confirm('Descartar todas as alterações feitas aqui?')) return;
      edits = {}; persist(); select(current);
    });

    select(current);
  })();
  </script>
</body>
</html>
