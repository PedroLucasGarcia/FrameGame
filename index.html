<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameGame</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="header">
        <nav class="nav">
            <div class="logo">
                <a href="index.html"><img src="img/logo.png" alt="">
            </div>
            <div>
                <ul class="nav-links">
                    <li><a href="selectLevel/selectLevel.html" id="levels-link"><i class="fa-solid fa-grip-vertical"></i></a></li>
                    <li><a href="#"><i class="fa-regular fa-circle-question"></i></a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container-text">
        <h2>Será que você consegue acertar o filme vendo apenas uma imagem?</h2>
        <p>Você terá 6 chances! Se não souber na primeira, poderá passar para a próxima imagem até chegar à sexta e última. Mas cuidado: se não acertar o nome do filme... é game over!</p>
        <div class="img">
            <img src="img/home.gif" alt="">
        </div>
    </div>

    <div class="container-startGame">
        <button class="startGame"><a href="selectLevel/selectLevel.html">Jogar agora</a></button>
    </div>

    <script src="js/script.js"></script>
