<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameGame - Level 1</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/styleLevel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header id="header">
        <nav class="nav">
            <div class="logo">
                <a href="../index.html"><img src="../img/logo.png" alt=""></a>
            </div>
            <div>
                <ul class="nav-links">
                    <li><a href="../selectLevel/selectLevel.html" id="levels-link"><i class="fa-solid fa-grip-vertical"></i></a></li>
                    <li><a href="#"><i class="fa-regular fa-circle-question"></i></a></li>
                </ul>
            </div>   
        </nav>
    </header>
    
    <div class="container">
        <div class="frame">
            <img id="movieFrame" src="img/img1.png" alt="Movie Frame">
        </div>
    
        <div class="frameFase">
            <button type="button" class="frameFase1" data-image="img1.png" onclick="img1()">1</button>
            <button type="button" class="frameFase2" data-image="img2.png" onclick="img2()">2</button>
            <button type="button" class="frameFase3" data-image="img3.png" onclick="img3()">3</button>
            <button type="button" class="frameFase4" data-image="img4.png" onclick="img4()">4</button>
            <button type="button" class="frameFase5" data-image="img5.png" onclick="img5()">5</button>
            <button type="button" class="frameFase6" data-image="img6.png" onclick="img6()">6</button>
        </div>
    
        <div class="game-container">
            <div class="input-container">
                <div class="input-section">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="movieName" class="movie-name" type="text" autocomplete="off" placeholder="Digite o nome do filme">
                    <div id="movie-suggestions" class="suggestions-list"></div>
                    <button type="button" class="btn-submit" id="btnSubmit">ENVIAR</button>
                </div>
            </div>
            <div class="feedback"><p id="feedBack"></p></div>
    
            <div class="next-level">
                <button type="button" id="nextLevel"><a href="../level2/level2.html">Próximo nível</a></button>
            </div>
            <div>
                <button type="button" id="restartLevel" style="display: none;"><a href="level1.html"></a></button>
            </div>
        </div>
    </div>

    <!-- Resposta correta para o nível 1 -->
    <script>const correctAnswer = "Titanic (1997)";</script>
    
    <script src="../js/scriptLevel.js"></script>
    <script>
        document.getElementById('nextLevel').addEventListener('click', function() { 
            // Obtém o nível atual e o nível desbloqueado mais alto salvo no localStorage
            let currentLevel = 1; // Substitua pelo nível atual da fase em questão
            let unlockedLevels = localStorage.getItem('unlockedLevels') ? parseInt(localStorage.getItem('unlockedLevels')) : 1;

            // Se o nível atual for maior que o nível desbloqueado, atualiza o progresso
            if (currentLevel >= unlockedLevels) {
                unlockedLevels = currentLevel + 1; // Desbloqueia o próximo nível
                localStorage.setItem('unlockedLevels', unlockedLevels);
            }

            // Redireciona para o próximo nível baseado no nível atual
            window.location.href = `level${currentLevel + 1}.html`;
        });

        document.getElementById('nextLevel').addEventListener('click', function() { 
            // Obtém os níveis desbloqueados atuais ou começa com 1 se não estiver definido
            let unlockedLevels = localStorage.getItem('unlockedLevels') ? parseInt(localStorage.getItem('unlockedLevels')) : 1;

            // Desbloqueia o próximo nível se ainda não estiver desbloqueado
            if (unlockedLevels === 1) { // Esta verificação deve ser para o nível atual
                unlockedLevels = 2; // Desbloqueia o próximo nível
                localStorage.setItem('unlockedLevels', unlockedLevels);
            } 
            // Redireciona para o próximo nível (Level 2 neste caso)
            window.location.href = 'level2.html';
        });

        levelCompleted(1); // Atualiza o progresso para o próximo nível 
    </script>
    
    
</body>
</html>
